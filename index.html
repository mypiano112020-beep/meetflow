<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MeetFlow｜教育訓練影片相關會議</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#1d2d43;font-family:system-ui,'Noto Sans TC',sans-serif}header{background:#18365a;color:white;padding:20px max(18px,calc((100% - 1040px)/2))}header b{font-size:23px}main{max-width:1040px;margin:24px auto;padding:0 16px}.card{background:white;border:1px solid #dce5f0;border-radius:15px;padding:20px;margin-bottom:16px;box-shadow:0 4px 20px #173b6109}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}button{border:0;background:#2566ae;color:white;border-radius:9px;padding:10px 15px;cursor:pointer;font:inherit}button.secondary{background:#eaf1f9;color:#1f568d}button.active{background:#18365a}input{border:1px solid #c8d4e1;border-radius:8px;padding:10px;font:inherit;width:100%}label{font-weight:600}small,.muted{color:#687a91}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.day{border:1px solid #d9e4f0;border-radius:9px;padding:10px;min-height:295px;background:#fbfdff}.day strong{display:block;margin-bottom:8px}.slot{display:block;width:100%;text-align:left;margin:5px 0;padding:7px;background:#e9f1fc;color:#244f7d;font-size:12px}.slot.chosen{background:#d9f3e5;color:#125c3b}.slot em{display:block;font-style:normal;color:#60758a;font-size:11px}.slotline{display:flex;justify-content:space-between;align-items:center;border:1px solid #e2e9f1;padding:10px;border-radius:9px;margin:6px 0}.slotline input{width:auto}.bar{height:7px;background:#e8eef6;border-radius:8px;overflow:hidden}.fill{height:100%;background:#367bc4}.hidden{display:none!important}.notice{padding:12px;background:#edf5ff;border-radius:9px;margin:12px 0}.error{background:#fff0ef;color:#9a2823}.ok{background:#e5f7eb;color:#246641}.columns{display:grid;grid-template-columns:300px 1fr;gap:16px}.stat{padding:10px;border-bottom:1px solid #e4eaf2}a{color:#2566ae;word-break:break-all}@media(max-width:760px){.columns{grid-template-columns:1fr}.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}.day{padding:4px;min-height:90px}.slot{padding:5px 2px;font-size:10px}.card{padding:13px}}

/* 簡易問卷：所有時段直接展開，手機以單日卡片呈現 */
.day{min-height:300px}.slot{min-height:35px;margin:5px 0;padding:6px;font-size:12px;white-space:normal}.slot em{font-size:10px}
.grid.week-view{grid-template-columns:repeat(5,minmax(0,1fr))}
#participantPanel{position:sticky;top:12px}#choices{display:none}#submitBtn{font-weight:700;font-size:16px;padding:13px}
@media(max-width:760px){.grid,.grid.week-view{grid-template-columns:1fr}.day{min-height:0;padding:12px}.slot{display:flex;align-items:center;justify-content:space-between;min-height:40px;font-size:14px;padding:8px}.slot em{font-size:12px}#participantPanel{position:static}}
button.slot{touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}button.slot:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}button.slot.chosen{border:2px solid #174e9d}body:has(#calendar){} .slot.chosen{background:#2566ae;color:white}.slot.chosen em{color:#e4efff} .grid{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.week-view{grid-template-columns:repeat(4,minmax(0,1fr))}@media(max-width:760px){.grid,.grid.week-view{grid-template-columns:1fr}.columns{display:flex;flex-direction:column}.columns>div{order:1}.columns>aside{display:contents}#participantPanel{order:0}#adminLogin,#adminTools{order:2;margin-top:8px}#participantPanel{position:static}} </style></head><body><header><b>◈ MeetFlow</b><div style="color:#c7d9eb;font-size:13px">教育訓練影片相關會議｜多人時間協調</div></header><main><div id="alert" class="notice hidden"></div><div id="successPanel" class="card hidden" role="status" aria-live="polite" style="border:2px solid #55ae7d;background:#f0fff5;text-align:center"><div style="font-size:40px;color:#208b52">✓</div><h2 style="margin:5px 0;color:#16633b">可參加時段已送出成功！</h2><p>您的回覆已成功儲存，感謝協助填寫。</p><p id="successDetail" style="font-weight:700"></p><button id="editAgainBtn" class="secondary" type="button">修改可參加時段</button></div><section class="card"><div class="row between"><div><h2 id="title">教育訓練影片相關會議</h2><div class="muted" id="description">請選擇 2026/11/3–11/6 所有可參加時段</div></div><div class="row"><button id="monthBtn" class="secondary active">月曆</button><button id="weekBtn" class="secondary">週行事曆</button></div></div></section><div class="columns"><aside><section class="card" id="participantPanel"><h3>填寫可參加時間</h3><label>參加人員姓名</label><input id="person" maxlength="60" placeholder="例如：Jenny"><p class="muted">直接點選右側日期的藍色時段（可跨日期複選），選好後按下方按鈕。</p><div id="choices"></div><p id="count" class="muted">已選 0 個時段</p><button id="submitBtn" style="width:100%">送出可參加時間</button><p class="muted" style="font-size:12px">修改憑證儲存在此瀏覽器；更換裝置後無法直接修改原回覆。請勿共用瀏覽器資料。</p></section><section class="card" id="adminLogin"><h3>管理員登入</h3><input id="email" type="email" placeholder="管理員 Email"><div style="height:8px"></div><input id="password" type="password" placeholder="密碼"><div style="height:10px"></div><button id="loginBtn">登入管理員</button></section><section class="card hidden" id="adminTools"><div class="row between"><h3>管理員工具</h3><button id="logoutBtn" class="secondary">登出</button></div><p class="muted">建立新會議、查看姓名統計及下載 CSV。</p><label>新會議名稱</label><input id="newTitle" placeholder="會議名稱"><div style="height:8px"></div><button id="createBtn">建立工作週會議</button><div style="height:10px"></div><button id="exportBtn" class="secondary">匯出回覆 CSV</button><p class="muted" id="adminShare"></p></section></aside><div><section class="card"><div class="row between"><h3>11/3（二）—11/6（五）</h3><span class="muted">台灣時間 UTC+8</span></div><div id="calendar" class="grid"></div></section><section class="card hidden" id="statsPanel"><h3>各時段統計</h3><p class="muted" id="statHint">參與者可查看每個時段的回覆人數；姓名僅管理員可見。</p><div id="bestSlots" class="hidden"></div><div id="stats"></div></section></div></div></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
const $=id=>document.getElementById(id), cfg=window.MEETFLOW_CONFIG||{}, ready=cfg.supabaseUrl?.startsWith('https://')&&cfg.supabaseAnonKey&&!cfg.supabaseAnonKey.includes('YOUR_');
let db=ready?window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey):null,meeting=null,counts={},responses=[],chosen=new Set(),view='month',admin=false;
const defaultDates=['2026-11-03','2026-11-04','2026-11-05','2026-11-06'];const defaultTimes=['09:00-10:00','10:00-11:00','11:00-12:00','13:00-14:00','14:00-15:00','15:00-16:00'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const slot=(d,t)=>d+'|'+t;
function alertMsg(t,error=false){if(error)$('successPanel').classList.add('hidden');$('alert').textContent=t;$('alert').className='notice '+(error?'error':'ok')}
function tokenKey(){return 'mf_token_'+meeting.id+'_'+$('person').value.trim().toLowerCase()}
function getToken(){let key=tokenKey(),value=localStorage.getItem(key);if(!value){value=Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>b.toString(16).padStart(2,'0')).join('');localStorage.setItem(key,value)}return value}
async function rpc(fn,args){let {data,error}=await db.rpc(fn,args);if(error)throw Error(error.message);return data}
async function refresh(){if(!meeting||meeting.id==='preview')return;counts=admin?(await rpc('public_counts',{p_id:meeting.id})||{}):{};if(admin){let r=await db.from('availability').select('name,slots,updated_at').eq('meeting_id',meeting.id);if(r.error)throw Error(r.error.message);responses=r.data||[]}render()}
function render(){if(!meeting)return;$('title').textContent=meeting.title;$('description').textContent=meeting.description||'選擇所有可參加時段';$('count').textContent='已選 '+chosen.size+' 個時段';$('monthBtn').classList.toggle('active',view==='month');$('weekBtn').classList.toggle('active',view==='week');$('calendar').classList.toggle('week-view',view==='week');$('calendar').innerHTML=meeting.dates.map((d,i)=>'<div class="day"><strong>'+esc(d.slice(5))+'（'+['二','三','四','五'][i%4]+'）</strong>'+meeting.times.map(t=>{let k=slot(d,t),n=counts[k]||0;return '<button type="button" aria-pressed="'+chosen.has(k)+'" class="slot '+(chosen.has(k)?'chosen':'')+'" data-k="'+esc(k)+'"><span>'+esc(t)+'</span><em>'+(chosen.has(k)?'✓ 已選':'點選可參加')+'</em></button>'}).join('')+'</div>').join('');$('calendar').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let k=b.dataset.k;if(chosen.has(k)){chosen.delete(k)}else{chosen.add(k)}b.classList.toggle('chosen',chosen.has(k));b.setAttribute('aria-pressed',String(chosen.has(k)));b.querySelector('em').textContent=chosen.has(k)?'✓ 已選':'點選可參加';$('count').textContent='已選 '+chosen.size+' 個時段';});$('choices').innerHTML=meeting.dates.map(d=>'<details><summary>'+esc(d)+'</summary>'+meeting.times.map(t=>{let k=slot(d,t);return '<label class="slotline"><span>'+esc(t)+'</span><input type="checkbox" data-check="'+esc(k)+'" '+(chosen.has(k)?'checked':'')+'></label>'}).join('')+'</details>').join('');$('choices').querySelectorAll('[data-check]').forEach(x=>x.onchange=()=>{x.checked?chosen.add(x.dataset.check):chosen.delete(x.dataset.check);render()});let all=meeting.dates.flatMap(d=>meeting.times.map(t=>({d,t,k:slot(d,t),n:counts[slot(d,t)]||0}))).sort((a,b)=>b.n-a.n||a.k.localeCompare(b.k));let max=Math.max(1,...all.map(x=>x.n));let best=all.filter(x=>x.n===max&&x.n>0);let bestBox=$('bestSlots');bestBox.classList.toggle('hidden',!admin);if(admin){let unique=new Set(responses.map(r=>r.name.trim().toLowerCase())).size;bestBox.innerHTML='<div class="notice" style="background:#eaf4ff;color:#18365a"><b style="font-size:18px">🏆 最佳開會時段</b><p>已回覆：<b>'+unique+' 人</b>　｜　最多可參加：<b>'+(best.length?max:0)+' 人</b>　｜　並列：<b>'+best.length+' 個時段</b></p>'+(best.length?best.map(x=>'<div class="stat"><b>'+esc(x.d)+' '+esc(x.t)+'</b>　<span>'+x.n+' 人</span><div style="font-size:13px">'+esc(responses.filter(r=>Array.isArray(r.slots)&&r.slots.includes(x.k)).map(r=>r.name).join('、'))+'</div></div>').join(''):'<div>尚無同仁回覆</div>')+'</div><h4>全部時段排名（由多至少）</h4>';} $('stats').innerHTML=all.map(x=>'<div class="stat"><div class="row between"><b>'+esc(x.d)+' '+esc(x.t)+'</b><span>'+x.n+' 人</span></div>'+(admin?'<div class="muted">'+esc(responses.filter(r=>r.slots.includes(x.k)).map(r=>r.name).join('、')||'尚無回覆')+'</div>':'')+'<div class="bar"><div class="fill" style="width:'+(x.n/max*100)+'%"></div></div></div>').join('');$('statHint').textContent=admin?'管理員可查看各時段參加人員姓名。':'公開頁面只顯示人數，參加者姓名不公開。'}
async function loadMeeting(id){let m=await rpc('public_meeting',{p_id:id});if(!m)throw Error('找不到此會議');meeting=m;chosen.clear();$('submitBtn').disabled=false;$('submitBtn').textContent='送出可參加時間';await refresh()}
$('editAgainBtn').onclick=()=>{$('successPanel').classList.add('hidden');$('participantPanel').scrollIntoView({behavior:'smooth',block:'start'})};$('monthBtn').onclick=()=>{view='month';render()};$('weekBtn').onclick=()=>{view='week';render()};
$('submitBtn').onclick=async()=>{if(!db)return alertMsg('請先完成雲端設定',true);let name=$('person').value.trim();if(!meeting||meeting.id==='preview')return alertMsg('目前為預覽模式，尚未建立正式會議。請先登入管理員並建立會議，取得可提交的專屬連結。',true);if(!chosen.size)return alertMsg('請先點選至少一個可參加時段',true);if(!name)return alertMsg('請先輸入姓名',true);$('submitBtn').disabled=true;try{await rpc('submit_availability',{p_meeting:meeting.id,p_name:name,p_slots:[...chosen],p_token:getToken()});await refresh();$('successDetail').textContent='填寫人員：'+name+'　｜　已提交：'+chosen.size+' 個時段';$('successPanel').classList.remove('hidden');$('alert').classList.add('hidden');$('successPanel').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){alertMsg('提交失敗：'+e.message,true)}finally{$('submitBtn').disabled=false}};
async function checkAdmin(){let {data:{user}}=await db.auth.getUser();admin=false;if(user){let r=await db.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();admin=!!r.data} $('adminLogin').classList.toggle('hidden',admin);$('adminTools').classList.toggle('hidden',!admin);$('statsPanel').classList.toggle('hidden',!admin);if(meeting&&meeting.id!=='preview')await refresh();else if(meeting)render()}
$('loginBtn').onclick=async()=>{try{let r=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)throw Error(r.error.message);await checkAdmin();if(!admin)throw Error('此帳號尚未加入 admins 管理員名單');alertMsg('管理員登入成功，請按「建立工作週會議」取得正式連結。');$('newTitle').value='教育訓練影片相關會議'}catch(e){alertMsg(e.message,true)}};
$('logoutBtn').onclick=async()=>{await db.auth.signOut();await checkAdmin()};
$('createBtn').onclick=async()=>{if(!admin)return;let title=$('newTitle').value.trim()||'教育訓練影片相關會議';let r=await db.from('meetings').insert({title,description:'請勾選所有可參加時段',dates:defaultDates,times:defaultTimes}).select().single();if(r.error)return alertMsg(r.error.message,true);location.href=location.pathname+'?meeting='+r.data.id};
$('exportBtn').onclick=()=>{if(!admin)return;let rows=[['姓名','日期','時段'],...responses.flatMap(r=>r.slots.map(k=>[r.name,...k.split('|')]))];let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='會議可參加時段.csv';a.click();URL.revokeObjectURL(a.href)};
(async()=>{if(!ready)return alertMsg('尚未設定 Supabase：請編輯 config.js，填入 Project URL 與 Publishable Key。',true);try{let id=new URLSearchParams(location.search).get('meeting');await checkAdmin();if(!id){if(!admin){meeting={id:'preview',title:'教育訓練影片相關會議',description:'2026/11/3–11/6｜請選擇所有可參加時段',dates:defaultDates,times:defaultTimes};render();$('submitBtn').disabled=true;$('submitBtn').textContent='請先由管理員建立正式會議';return alertMsg('目前是時間表預覽，尚不能提交。請先在下方登入管理員並建立正式會議。',true)};let r=await db.from('meetings').select('id').order('created_at',{ascending:false}).limit(1);if(r.error)throw Error(r.error.message);if(!r.data.length){let n=await db.from('meetings').insert({title:'教育訓練影片相關會議',description:'請選擇所有可參加時段',dates:defaultDates,times:defaultTimes}).select().single();if(n.error)throw Error(n.error.message);id=n.data.id}else id=r.data[0].id;history.replaceState({},'',location.pathname+'?meeting='+id)}await loadMeeting(id);$('adminShare').textContent='人員填寫網址：'+location.href;setInterval(()=>refresh().catch(console.warn),15000)}catch(e){alertMsg('載入失敗：'+e.message,true)}})();
</script></body></html>
